limit_req_zone $binary_remote_addr zone=push_limit:1m rate=30r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hardening: Masquer la version de Nginx
    server_tokens off;



    # Hardening: Headers de sécurité HTTP
    include /etc/nginx/security-headers.conf;


    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Never cache the PWA entry points: clients must discover new deployments.
    location = /sw.js {
        expires off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /push-sw.js {
        expires off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        expires off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Single Page Application routing
    location / {
        expires off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /api/push/subscriptions {
        limit_req zone=push_limit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://weather-api:8787/api/push/subscriptions;
        proxy_set_header Host $http_host;
        include /etc/nginx/security-headers.conf;
    }

    # Realtime weather backend (HTTP snapshot + Server-Sent Events)
    location /api/ {
        proxy_pass http://weather-api:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-transform";
    }

    # Reverse proxy for WindsUp (bypass datacenter IP blocking)
    location /proxy/windsup/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://www.winds-up.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.winds-up.com;
        proxy_set_header Accept-Encoding "";
        proxy_pass_header Set-Cookie;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Reverse proxy for WindsUp mobile site
    location /proxy/windsup-mobile/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://m.winds-up.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host m.winds-up.com;
        proxy_set_header Accept-Encoding "";
        proxy_pass_header Set-Cookie;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Hashed build assets can safely remain immutable for one year.
    location ^~ /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /workbox- {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
}
