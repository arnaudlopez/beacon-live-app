name: Warm weather cache

on:
  schedule:
    # Every 5 minutes — keeps cache hot so users always get instant responses
    - cron: '*/5 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping edge function
        run: |
          SUPABASE_URL="${{ vars.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://rnjtvepcoxvzlwrulnks.supabase.co"
          fi
          WEATHER_CACHE_URL="${SUPABASE_URL%/}/functions/v1/weather-cache"

          set +e
          STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 90 --retry 2 --retry-delay 5 \
            -o /tmp/weather-cache-response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$WEATHER_CACHE_URL")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Weather cache warmup failed before receiving an HTTP response. curl exit code: $CURL_EXIT"
            exit 0
          fi

          echo "Edge function responded: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Unexpected status $STATUS"
          fi
